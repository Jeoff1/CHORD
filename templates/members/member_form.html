{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} member | CHORD{% endblock %}
{% block content %}
  <h1 class="h3">{% if object %}Edit {{ object.full_name }}{% else %}Add member{% endif %}</h1>
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
      <button class="btn btn-primary" type="submit">Save member</button>
      <a class="btn btn-link" href="{% url 'members:list' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
