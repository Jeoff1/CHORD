{% extends "base.html" %}
{% block title %}Log in | CHORD{% endblock %}
{% block unauthenticated_content %}
  <section class="chord-auth-card" aria-labelledby="login-heading">
    <p class="chord-auth-card__eyebrow">Church workspace</p>
    <h1 id="login-heading">Welcome back</h1>
    <p class="chord-auth-card__intro">Sign in to continue to your CHORD workspace.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
