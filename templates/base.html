<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CHORD{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'accounts:dashboard' %}">CHORD</a>
      {% if user.is_authenticated %}
        <div class="navbar-nav ms-auto align-items-lg-center">
          <a class="nav-link" href="{% url 'accounts:profile' %}">Profile</a>
          {% if perms.accounts.manage_accounts %}
            <a class="nav-link" href="{% url 'accounts:user-list' %}">Accounts</a>
          {% endif %}
          {% if perms.members.view_member_directory %}
            <a class="nav-link" href="{% url 'members:list' %}">Members</a>
          {% endif %}
          <form method="post" action="{% url 'accounts:logout' %}" class="ms-lg-2">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
          </form>
        </div>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
